[phases.setup]
nixPkgs = ["php", "composer", "nodejs_18", "yarn"]

[phases.build]
cmds = [
  "composer install",
  "npm install --production",
  "php artisan optimize",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache",
  "php artisan migrate --force",
  "php artisan storage:link"
]
